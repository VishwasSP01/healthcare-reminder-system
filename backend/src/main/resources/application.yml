spring:
  application:
    name: healthcare-reminder-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/healthcare_reminder}
    username: ${SPRING_DATASOURCE_USERNAME:healthcare_user}
    password: ${SPRING_DATASOURCE_PASSWORD:healthcare_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  ocr:
    provider: ${OCR_PROVIDER:textract}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  security:
    jwt-secret: ${JWT_SECRET:local-development-secret-change-me-local-development-secret-change-me}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:30}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:14}
  aws:
    region: ${AWS_REGION:ap-south-1}
    s3-bucket: ${AWS_S3_BUCKET:healthcare-reminder-prescriptions}
    s3-prescription-prefix: ${AWS_S3_PRESCRIPTION_PREFIX:prescriptions}
    s3-presigned-url-minutes: ${AWS_S3_PRESIGNED_URL_MINUTES:15}
    max-prescription-upload-bytes: ${MAX_PRESCRIPTION_UPLOAD_BYTES:10485760}
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  notifications:
    fcm-retry-delay-ms: ${FCM_RETRY_DELAY_MS:60000}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    whatsapp-from: ${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
